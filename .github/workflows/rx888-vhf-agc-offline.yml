name: RX888 VHF AGC offline checks

# Experimental branch only. No attached radios, no service restart or firmware flashing.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/rx888.c'
      - 'src/rx888_vhf_gain.h'
      - 'src/rx888_vhf_agc_bits.h'
      - 'tests/test_rx888_vhf_agc_bits.c'
      - 'tests/test_rx888_vhf_agc_source.py'
      - 'docs/RX888_VHF_HARDWARE_AGC_LAB.md'
      - '.github/workflows/rx888-vhf-agc-offline.yml'
  push:
    branches:
      - feature/rx888-vhf-hardware-agc-lab
    paths:
      - src/rx888.c
      - src/rx888_vhf_gain.h
      - src/rx888_vhf_agc_bits.h
      - tests/test_rx888_vhf_agc_bits.c
      - tests/test_rx888_vhf_agc_source.py
      - .github/workflows/rx888-vhf-agc-offline.yml
      - docs/RX888_VHF_HARDWARE_AGC_LAB.md

jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated source-contract checks
        run: python3 -m unittest discover -s tests -p test_rx888_vhf_agc_source.py -v
      - name: Compile and execute R828D gain bit tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tests/test_rx888_vhf_agc_bits.c -o /tmp/test_rx888_vhf_agc_bits
          /tmp/test_rx888_vhf_agc_bits

  build-rx888-only:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install RX888-only build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libbsd-dev libfftw3-dev libopus-dev \
            libiniparser-dev libncurses-dev libusb-1.0-0-dev portaudio19-dev \
            libsamplerate0-dev libogg-dev libcsv-dev libavahi-client-dev
      - name: Build radiod and RX888 plugin only, without installing or running
        run: |
          make -C src -j2 radiod rx888.so \
            ENABLE_RX888=1 ENABLE_AIRSPY=0 ENABLE_AIRSPYHF=0 \
            ENABLE_BLADERF=0 ENABLE_FOBOS=0 ENABLE_FUNCUBE=0 \
            ENABLE_HACKRF=0 ENABLE_HYDRASDR=0 ENABLE_RTLSDR=0 \
            ENABLE_SDRPLAY=0 ENABLE_SIG_GEN=0 ENABLE_SOAPY=0 NATIVE=0
          test -f src/radiod
          test -f src/rx888.so
